services:
  # ── 1. Python OSINT Engine ─────────────────────────────────────────
  - type: web
    name: traceguard-python-engine
    env: python
    plan: free
    rootDir: python-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: LEAKCHECK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SHODAN_API_KEY
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: USE_MOCK_DATA
        value: "false"

  # ── 2. Express Backend Gateway ──────────────────────────────────────
  - type: web
    name: traceguard-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: "10000"
      - key: PYTHON_ENGINE_URL
        fromService:
          type: web
          name: traceguard-python-engine
          property: host

  # ── 3. Next.js Frontend UI ──────────────────────────────────────────
  - type: web
    name: traceguard-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
